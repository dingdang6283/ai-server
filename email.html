<head>
  <meta charset="UTF-8">

  <title>DingDang Cloud 验证邮件</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f6f9;font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;">
  <table role="presentation" style="width:100%;max-width:600px;margin:0 auto;padding:24px 12px;">
    <tr>
      <td style="text-align:center;padding:24px 0 12px;">
        <div style="font-size:24px;font-weight:800;background:linear-gradient(135deg,#6366f1,#14b8a6);-webkit-background-clip:text;background-clip:text;color:transparent;">
          DingDang Cloud
        </div>
        <p style="color:#94a3b8;font-size:13px;margin:4px 0 0;">千问API 智能中转平台</p>
      </td>
    </tr>
    <tr>
      <td style="background:#ffffff;border-radius:12px;padding:32px 28px;box-shadow:0 1px 4px rgba(0,0,0,0.06);">
        <h2 style="font-size:18px;color:#1e293b;margin:0 0 8px;font-weight:600;">邮箱验证</h2>
        <p style="color:#64748b;font-size:14px;line-height:1.7;margin:0 0 20px;">
          您好！感谢您使用 DingDang Cloud 服务。<br>
          请使用以下验证码完成操作：
        </p>
        <div style="background:#f1f5f9;border-radius:8px;padding:16px;text-align:center;margin:0 0 20px;letter-spacing:8px;font-size:32px;font-weight:700;color:#6366f1;font-family:'Courier New',monospace;">
          {{CODE}}
        </div>
        <p style="color:#94a3b8;font-size:13px;line-height:1.6;margin:0;">
          该验证码 <strong style="color:#ef4444;">5分钟内</strong> 有效，请勿泄露给他人。<br>
          如果不是您本人操作，请忽略此邮件。
        </p>
      </td>
    </tr>
    <tr>
      <td style="text-align:center;padding:20px 0 0;">
        <p style="color:#94a3b8;font-size:12px;margin:0;">
          &copy; 2026 DingDang Cloud. All rights reserved.
        </p>
      </td>
    </tr>
  </table>
</body>
