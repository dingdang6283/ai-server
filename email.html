<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>DingDang Cloud 验证邮件</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f6fa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;">
  <table role="presentation" style="width:100%;max-width:600px;margin:0 auto;border-collapse:collapse;" cellspacing="0" cellpadding="0">
    <!-- 顶部品牌区 -->
    <tr>
      <td style="padding:40px 16px 16px;text-align:center;">
        <table role="presentation" style="width:100%;border-collapse:collapse;" cellspacing="0" cellpadding="0">
          <tr>
            <td style="text-align:center;">
              <table role="presentation" style="margin:0 auto;border-collapse:collapse;" cellspacing="0" cellpadding="0">
                <tr>
                  <td style="width:52px;height:52px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:14px;text-align:center;vertical-align:middle;">
                    <span style="font-size:24px;color:#fff;font-weight:800;line-height:52px;">D</span>
                  </td>
                </tr>
              </table>
              <div style="font-size:20px;font-weight:700;color:#1e293b;letter-spacing:-0.3px;margin-top:12px;">DingDang Cloud</div>
              <p style="color:#94a3b8;font-size:13px;margin:4px 0 0;">智能 AI 中转平台</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>

    <!-- 主卡片 -->
    <tr>
      <td style="padding:8px 16px;">
        <table role="presentation" style="width:100%;background:#ffffff;border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,0.08);border-collapse:collapse;overflow:hidden;" cellspacing="0" cellpadding="0">
          <!-- 顶部装饰渐变条 -->
          <tr>
            <td style="padding:0;">
              <table role="presentation" style="width:100%;height:6px;border-collapse:collapse;" cellspacing="0" cellpadding="0">
                <tr>
                  <td style="background:linear-gradient(90deg,#6366f1,#8b5cf6,#a78bfa);height:6px;padding:0;"></td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:36px 36px 28px;">
              <!-- 图标 -->
              <table role="presentation" style="width:60px;height:60px;background:linear-gradient(135deg,#eef2ff,#e0e7ff);border-radius:16px;margin-bottom:20px;" cellspacing="0" cellpadding="0">
                <tr>
                  <td style="text-align:center;vertical-align:middle;">
                    <span style="font-size:30px;line-height:60px;">🔐</span>
                  </td>
                </tr>
              </table>

              <!-- 标题 -->
              <h2 style="font-size:22px;color:#0f172a;margin:0 0 8px;font-weight:700;">邮箱验证</h2>
              <p style="color:#64748b;font-size:15px;line-height:1.7;margin:0 0 28px;">
                您好！感谢您使用 DingDang Cloud 服务。<br>请使用以下验证码完成操作：
              </p>

              <!-- 验证码卡片 -->
              <table role="presentation" style="width:100%;background:linear-gradient(135deg,#f8fafc,#f1f5f9);border-radius:16px;border:1px solid #e2e8f0;margin-bottom:28px;" cellspacing="0" cellpadding="0">
                <tr>
                  <td style="text-align:center;padding:28px 20px;">
                    <p style="color:#64748b;font-size:12px;margin:0 0 12px;text-transform:uppercase;letter-spacing:2px;">验证码</p>
                    <div style="letter-spacing:12px;font-size:42px;font-weight:800;color:#6366f1;font-family:'Courier New',Consolas,'SF Mono',monospace;line-height:1.2;text-align:center;">
                      {{CODE}}
                    </div>
                  </td>
                </tr>
              </table>

              <!-- 安全提示 -->
              <table role="presentation" style="width:100%;background:#fef2f2;border-radius:12px;border:1px solid #fecaca;margin-bottom:20px;" cellspacing="0" cellpadding="0">
                <tr>
                  <td style="padding:14px 18px;">
                    <table role="presentation" style="width:100%;border-collapse:collapse;" cellspacing="0" cellpadding="0">
                      <tr>
                        <td style="vertical-align:top;width:24px;">
                          <span style="font-size:16px;">⏰</span>
                        </td>
                        <td>
                          <p style="color:#dc2626;font-size:13px;line-height:1.6;margin:0;">
                            <strong>有效期：</strong>验证码 <strong>5 分钟</strong>内有效，请勿泄露给他人。
                          </p>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>

              <!-- 底部信息 -->
              <table role="presentation" style="width:100%;border-top:1px solid #f1f5f9;margin-top:8px;" cellspacing="0" cellpadding="0">
                <tr>
                  <td style="padding:16px 0 0;">
                    <p style="color:#94a3b8;font-size:13px;line-height:1.6;margin:0;">
                      如果不是您本人操作，请忽略此邮件。<br>
                      如有疑问，请联系管理员。
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>

    <!-- 底部版权 -->
    <tr>
      <td style="padding:20px 16px 32px;text-align:center;">
        <p style="color:#94a3b8;font-size:12px;margin:0 0 4px;">&copy; 2026 DingDang Cloud. All rights reserved.</p>
        <p style="color:#cbd5e1;font-size:11px;margin:0;">此邮件由系统自动发送，请勿回复。</p>
      </td>
    </tr>
  </table>
</body>
</html>
