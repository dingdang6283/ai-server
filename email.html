<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>DingDang Cloud 验证邮件</title>
</head>
<body style="margin:0;padding:0;background-color:#f0f2f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;">
  <table role="presentation" style="width:100%;max-width:600px;margin:0 auto;border-collapse:collapse;">
    <tr>
      <td style="padding:32px 16px 8px;text-align:center;">
        <table role="presentation" style="width:100%;border-collapse:collapse;">
          <tr>
            <td style="text-align:center;">
              <div style="width:48px;height:48px;background:linear-gradient(135deg,#6366f1,#14b8a6);border-radius:12px;display:inline-block;line-height:48px;font-size:22px;color:#fff;font-weight:800;text-align:center;margin-bottom:8px;">D</div>
              <div style="font-size:22px;font-weight:700;color:#1e293b;letter-spacing:-0.5px;">DingDang Cloud</div>
              <p style="color:#94a3b8;font-size:13px;margin:2px 0 0;">千问API 智能中转平台</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td style="padding:12px 16px;">
        <table role="presentation" style="width:100%;background:#ffffff;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,0.06);border-collapse:collapse;overflow:hidden;">
          <tr>
            <td style="padding:0;">
              <div style="height:4px;background:linear-gradient(90deg,#6366f1,#14b8a6,#f59e0b);"></div>
            </td>
          </tr>
          <tr>
            <td style="padding:32px 32px 24px;">
              <div style="width:56px;height:56px;background:#eef2ff;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;">
                <span style="font-size:28px;">🔐</span>
              </div>
              <h2 style="font-size:20px;color:#0f172a;margin:0 0 6px;font-weight:700;">邮箱验证</h2>
              <p style="color:#475569;font-size:14px;line-height:1.7;margin:0 0 24px;">
                您好！感谢您使用 DingDang Cloud 服务。<br>请使用以下验证码完成操作：
              </p>
              <table role="presentation" style="width:100%;border-collapse:collapse;margin-bottom:24px;">
                <tr>
                  <td style="background:#f8fafc;border-radius:12px;padding:20px;text-align:center;border:1px solid #e2e8f0;">
                    <div style="letter-spacing:10px;font-size:36px;font-weight:700;color:#6366f1;font-family:'Courier New',Consolas,monospace;line-height:1.2;">
                      {{CODE}}
                    </div>
                  </td>
                </tr>
              </table>
              <table role="presentation" style="width:100%;background:#fef2f2;border-radius:10px;border-collapse:collapse;margin-bottom:20px;">
                <tr>
                  <td style="padding:12px 16px;">
                    <p style="color:#dc2626;font-size:13px;line-height:1.5;margin:0;">
                      <strong>⏰ 有效期：</strong>验证码 <strong>5 分钟</strong>内有效，请勿泄露给他人。
                    </p>
                  </td>
                </tr>
              </table>
              <p style="color:#94a3b8;font-size:13px;line-height:1.6;margin:0;border-top:1px solid #f1f5f9;padding-top:16px;">
                如果不是您本人操作，请忽略此邮件。<br>
                如有疑问，请联系管理员。
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td style="padding:16px;text-align:center;">
        <p style="color:#94a3b8;font-size:12px;margin:0 0 4px;">&copy; 2026 DingDang Cloud. All rights reserved.</p>
        <p style="color:#cbd5e1;font-size:11px;margin:0;">此邮件由系统自动发送，请勿回复。</p>
      </td>
    </tr>
  </table>
</body>
</html>
