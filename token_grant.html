<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>DingDang Cloud - Token 发放</title>
</head>
<body style="margin:0;padding:0;background-color:#f0f2f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;">
  <table role="presentation" style="width:100%;max-width:600px;margin:0 auto;border-collapse:collapse;">
    <tr>
      <td style="padding:32px 16px 8px;text-align:center;">
        <table role="presentation" style="width:100%;border-collapse:collapse;">
          <tr>
            <td style="text-align:center;">
              <div style="width:48px;height:48px;background:linear-gradient(135deg,#6366f1,#14b8a6);border-radius:12px;display:inline-block;line-height:48px;font-size:22px;color:#fff;font-weight:800;text-align:center;margin-bottom:8px;">D</div>
              <div style="font-size:22px;font-weight:700;color:#1e293b;letter-spacing:-0.5px;">DingDang Cloud</div>
              <p style="color:#94a3b8;font-size:13px;margin:2px 0 0;">千问API 智能中转平台</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td style="padding:12px 16px;">
        <table role="presentation" style="width:100%;background:#ffffff;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,0.06);border-collapse:collapse;overflow:hidden;">
          <tr>
            <td style="padding:0;">
              <div style="height:4px;background:linear-gradient(90deg,#f59e0b,#6366f1,#14b8a6);"></div>
            </td>
          </tr>
          <tr>
            <td style="padding:32px 32px 24px;">
              <div style="width:56px;height:56px;background:#fefce8;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;">
                <span style="font-size:28px;">🎁</span>
              </div>
              <h2 style="font-size:20px;color:#0f172a;margin:0 0 6px;font-weight:700;">{{SUBJECT}}</h2>
              <div style="color:#475569;font-size:14px;line-height:1.8;margin:0 0 20px;white-space:pre-wrap;">{{BODY}}</div>

              <table role="presentation" style="width:100%;background:linear-gradient(135deg,#eef2ff,#f0fdf4);border-radius:12px;border-collapse:collapse;margin-bottom:24px;border:1px solid #e0e7ff;">
                <tr>
                  <td style="padding:20px;text-align:center;">
                    <p style="color:#64748b;font-size:13px;margin:0 0 8px;">🎉 您获得的 Token 数量</p>
                    <div style="font-size:40px;font-weight:800;background:linear-gradient(135deg,#6366f1,#14b8a6);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2;">
                      {{TOKEN_AMOUNT}}
                    </div>
                    <p style="color:#94a3b8;font-size:12px;margin:4px 0 0;">可随时使用，永不过期</p>
                  </td>
                </tr>
              </table>

              <table role="presentation" style="width:100%;border-collapse:collapse;margin-bottom:16px;">
                <tr>
                  <td style="text-align:center;">
                    <table role="presentation" style="display:inline-block;border-collapse:collapse;">
                      <tr>
                        <td style="border-radius:12px;background:linear-gradient(135deg,#6366f1,#4f46e5);padding:0;">
                          <a href="{{CLAIM_URL}}" target="_blank"
                             style="display:inline-block;padding:14px 40px;font-size:16px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:12px;background:linear-gradient(135deg,#6366f1,#4f46e5);">
                            点击领取 Token
                          </a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>

              <table role="presentation" style="width:100%;background:#fef2f2;border-radius:10px;border-collapse:collapse;margin-bottom:16px;">
                <tr>
                  <td style="padding:12px 16px;">
                    <p style="color:#dc2626;font-size:13px;line-height:1.5;margin:0;">
                      <strong>⏰ 此链接有效期为 1 小时</strong>，请尽快领取。每个链接仅可使用一次。
                    </p>
                  </td>
                </tr>
              </table>

              <p style="color:#94a3b8;font-size:12px;line-height:1.6;margin:0;border-top:1px solid #f1f5f9;padding-top:16px;">
                如果按钮无法点击，请复制以下链接到浏览器中打开：<br>
                <span style="color:#6366f1;word-break:break-all;font-size:11px;">{{CLAIM_URL}}</span>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td style="padding:16px;text-align:center;">
        <p style="color:#94a3b8;font-size:12px;margin:0 0 4px;">&copy; 2026 DingDang Cloud. All rights reserved.</p>
        <p style="color:#cbd5e1;font-size:11px;margin:0;">此邮件由系统自动发送，请勿回复。</p>
      </td>
    </tr>
  </table>
</body>
</html>
