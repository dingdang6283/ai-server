<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>DingDang Cloud 通知</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f6fa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;">
  <table role="presentation" style="width:100%;max-width:600px;margin:0 auto;border-collapse:collapse;" cellspacing="0" cellpadding="0">
    <!-- 顶部品牌区 -->
    <tr>
      <td style="padding:40px 16px 16px;text-align:center;">
        <table role="presentation" style="width:100%;border-collapse:collapse;" cellspacing="0" cellpadding="0">
          <tr>
            <td style="text-align:center;">
              <table role="presentation" style="margin:0 auto;border-collapse:collapse;" cellspacing="0" cellpadding="0">
                <tr>
                  <td style="width:52px;height:52px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:14px;text-align:center;vertical-align:middle;">
                    <span style="font-size:24px;color:#fff;font-weight:800;line-height:52px;">D</span>
                  </td>
                </tr>
              </table>
              <div style="font-size:20px;font-weight:700;color:#1e293b;letter-spacing:-0.3px;margin-top:12px;">DingDang Cloud</div>
              <p style="color:#94a3b8;font-size:13px;margin:4px 0 0;">智能 AI 中转平台</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>

    <!-- 主卡片 -->
    <tr>
      <td style="padding:8px 16px;">
        <table role="presentation" style="width:100%;background:#ffffff;border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,0.08);border-collapse:collapse;overflow:hidden;" cellspacing="0" cellpadding="0">
          <!-- 顶部装饰渐变条 -->
          <tr>
            <td style="padding:0;">
              <table role="presentation" style="width:100%;height:6px;border-collapse:collapse;" cellspacing="0" cellpadding="0">
                <tr>
                  <td style="background:linear-gradient(90deg,#6366f1,#8b5cf6,#a78bfa);height:6px;padding:0;"></td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:36px 36px 28px;">
              <!-- 图标 -->
              <table role="presentation" style="width:60px;height:60px;background:linear-gradient(135deg,#fefce8,#fef3c7);border-radius:16px;margin-bottom:20px;" cellspacing="0" cellpadding="0">
                <tr>
                  <td style="text-align:center;vertical-align:middle;">
                    <span style="font-size:30px;line-height:60px;">📢</span>
                  </td>
                </tr>
              </table>

              <!-- 标题 -->
              <h2 style="font-size:22px;color:#0f172a;margin:0 0 16px;font-weight:700;">{{SUBJECT}}</h2>

              <!-- 内容 -->
              <div style="color:#475569;font-size:15px;line-height:1.8;margin:0 0 24px;white-space:pre-wrap;">
                {{BODY}}
              </div>

              <!-- 分隔线 -->
              <table role="presentation" style="width:100%;border-collapse:collapse;" cellspacing="0" cellpadding="0">
                <tr>
                  <td style="border-top:1px solid #f1f5f9;padding:20px 0 0;">
                    <p style="color:#94a3b8;font-size:13px;margin:0;line-height:1.6;">
                      DingDang Cloud 团队<br>
                      如有疑问，请登录后台查看详情。
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>

    <!-- 底部版权 -->
    <tr>
      <td style="padding:20px 16px 32px;text-align:center;">
        <p style="color:#94a3b8;font-size:12px;margin:0 0 4px;">&copy; 2026 DingDang Cloud. All rights reserved.</p>
        <p style="color:#cbd5e1;font-size:11px;margin:0;">此邮件由系统自动发送，请勿回复。</p>
      </td>
    </tr>
  </table>
</body>
</html>
